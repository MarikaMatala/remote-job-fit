# KOMMENTOINTIOHJE / CODE MAP
# Tiedoston tarkoitus: Esimerkkiasetukset käyttäjän osaamisprofiilille ja työnhaun kriteereille.
# Rakenne: yleiset asetukset ensin; jokainen seuraava avain tai työvaihe määrittää oman asetuskokonaisuutensa.
# Muuta arvoja harkiten ja säilytä YAML-sisennys.

# GENERIC PROFILE TEMPLATE — NOT A REAL PERSON'S PROFILE
# Copy this file to config/profile.yaml and edit the copy on your own computer.
# config/profile.yaml is ignored by Git. Never commit it.
#
# IMPORTANT PRIVACY RULES:
# - Add skills and job-search preferences here, not passwords or account details.
# - Never put API keys, access tokens, private API URLs, or credentials in this file.
# - This project currently uses public job-listing endpoints that do not need API keys.
# - If a future integration needs a secret, load it from a local .env variable on
#   the Python backend. Never place secrets in TypeScript, HTML, CSS, or browser code.
#
# The example roles and skill groups are informed by publicly visible Finnish
# job advertisements and job-market listings reviewed in November 2026.
# They are illustrative search terms, not a claim that every role is currently
# open, not a complete list of requirements, and not verified qualifications.
# Always check the original advertisement for required education and experience.
#
# To customize:
# - name: label displayed in match results.
# - level: self-rating from 1 (basic) to 5 (advanced); used when an advert
#   explicitly states a nearby proficiency requirement.
# - keywords: terms searched in job title, description, tags, and category.
# - aliases: alternative spellings and inflections; they do not add extra points.
# Requirement language (required/preferred/optional) is inferred from nearby
# advert text. Keep levels honest and edit keywords to reflect real experience.

