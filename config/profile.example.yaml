# GENERIC PROFILE TEMPLATE — NOT A REAL PERSON'S PROFILE
# Copy this file to config/profile.yaml and edit the copy on your own computer.
# config/profile.yaml is ignored by Git. Never commit it.
#
# IMPORTANT PRIVACY RULES:
# - Add skills and job-search preferences here, not passwords or account details.
# - Never put API keys, access tokens, private API URLs, or credentials in this file.
# - This project currently uses public job-listing endpoints that do not need API keys.
# - If a future integration needs a secret, load it from a local .env variable on
#   the Python backend. Never place secrets in TypeScript, HTML, CSS, or browser code.
#
# The example skill groups below cover common study/project areas:
# frontend, backend, full-stack, REST APIs, SQL/MySQL, NoSQL/MongoDB,
# programming languages, mobile development, UI/UX, testing, and DevOps.
# They are editable examples, not verified qualifications or a personal CV.
#
# To customize:
# - name: label displayed in match results.
# - level: optional self-rating from 1 (basic) to 5 (advanced); informational only.
# - keywords: terms searched in job title, description, tags, and category.
# Add/remove groups and keywords to reflect your own experience.
# The current score uses keywords only; it does not use level or target_titles.

profile:
  target_titles:
    - "Example Frontend Developer"
    - "Example Backend Developer"
    - "Example Full-Stack Developer"
    - "Example Junior Software Developer"
    - "Example Web Developer"
    - "Example API Developer"
    - "Example Database Developer"

  skills:
    - name: "Frontend Development"
      level: 3
      keywords:
        - "frontend"
        - "front-end"
        - "web development"
        - "html"
        - "css"
        - "javascript"
        - "typescript"
        - "responsive design"
        - "accessibility"
        - "bootstrap"

    - name: "Frontend Frameworks and Libraries"
      level: 3
      keywords:
        - "react"
        - "react.js"
        - "next.js"
        - "vue"
        - "angular"
        - "svelte"
        - "tailwind css"

    - name: "Backend Development"
      level: 2
      keywords:
        - "backend"
        - "back-end"
        - "server-side"
        - "backend development"
        - "node.js"
        - "express"
        - "python"
        - "php"
        - "java"
        - "c#"
        - ".net"

    - name: "Full-Stack Development"
      level: 2
      keywords:
        - "full-stack"
        - "full stack"
        - "fullstack"
        - "frontend and backend"
        - "web application development"

    - name: "REST APIs and Integrations"
      level: 2
      keywords:
        - "api"
        - "apis"
        - "rest api"
        - "restful"
        - "api integration"
        - "http"
        - "json"
        - "postman"
      # This group contains technology keywords only. Do not add API keys,
      # bearer tokens, private endpoints, or real service credentials here.

    - name: "SQL and Relational Databases"
      level: 2
      keywords:
        - "sql"
        - "mysql"
        - "sqlite"
        - "postgresql"
        - "relational database"
        - "database design"
        - "database queries"

    - name: "NoSQL Databases"
      level: 2
      keywords:
        - "nosql"
        - "mongodb"
        - "document database"

    - name: "Programming Languages"
      level: 3
      keywords:
        - "python"
        - "javascript"
        - "typescript"
        - "java"
        - "kotlin"
        - "php"
        - "c#"
        - "c sharp"
        - "object-oriented programming"
        - "oop"

    - name: "Mobile and Android Development"
      level: 2
      keywords:
        - "android development"
        - "android studio"
        - "kotlin"
        - "react native"
        - "mobile development"

    - name: "UI/UX and Prototyping"
      level: 3
      keywords:
        - "ui"
        - "ux"
        - "ui/ux"
        - "user interface"
        - "user experience"
        - "figma"
        - "wireframing"
        - "prototyping"
        - "usability"
        - "accessibility"

    - name: "Testing and Quality"
      level: 2
      keywords:
        - "software testing"
        - "unit testing"
        - "integration testing"
        - "pytest"
        - "jest"
        - "postman"
        - "quality assurance"

    - name: "Version Control and Collaboration"
      level: 3
      keywords:
        - "git"
        - "github"
        - "gitlab"
        - "version control"
        - "code review"
        - "agile"
        - "scrum"

    - name: "DevOps and Development Tools"
      level: 2
      keywords:
        - "docker"
        - "kubernetes"
        - "ci/cd"
        - "devops"
        - "visual studio code"
        - "vs code"

    - name: "Content Management and Web Publishing"
      level: 2
      keywords:
        - "wordpress"
        - "elementor"
        - "content management system"
        - "cms"

  # These fields are saved for future features and are not currently used
  # by the job scoring/filtering implementation.
  experience_keywords:
    - "team project"
    - "project work"
    - "collaboration"

  excluded_keywords: []
