# CODE MAP / COMMENTING GUIDE
# File purpose: Example settings for job search services and other job sources.
# Structure: general settings first; each following key or workflow step defines its own configuration group.
# Edit values carefully and preserve YAML indentation.

# JOB SOURCE AND LOCATION FILTER SETTINGS
# WORK IN PROGRESS: provider integrations and filter behavior may change.
# The built-in public feeds currently do not require API keys. Do not add
# private endpoints, access tokens, or API credentials to this public template.
# Copy this file to config/sources.yaml to customize it locally.
# config/sources.yaml is ignored by Git. Keep this public example generic.
#
# sources.<source_name>.enabled:
#   true  = request listings from this source.
#   false = skip this source.
#
# sources.<source_name>.url:
#   API endpoint used by the matching adapter in src/remotefit/sources.py.
#   Only change this if the provider documents a compatible endpoint. Changing
#   the URL does not add support for a new provider; a new adapter is required.
#
# filters.reject_restrictions:
#   Add lower-case or upper-case phrases that indicate a location restriction.
#   A listing containing one of these phrases is rejected by the current filter.
#   This is a simple text check, not a complete legal/work-eligibility parser.
#
# Note: the filter requires a worldwide marker in structured location or
# eligibility data. Common restrictions are checked in listing text, but this
# heuristic is not a complete legal, residency, or time-zone eligibility parser.

sources:
  remotive:
    enabled: true
    url: "https://remotive.com/api/remote-jobs"
  remoteok:
    enabled: true
    url: "https://remoteok.com/api"

filters:
  worldwide_only: true
  reject_restrictions:
    - "us only"
    - "usa only"
    - "united states only"
    - "uk only"
    - "canada only"
    - "europe only"
    - "must be based in"
    - "must reside in"
    - "authorized to work in"
