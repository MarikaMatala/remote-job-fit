[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-job-fit"
version = "0.2.0"
description = "Discover worldwide-remote jobs and compare them with a private skills profile."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
remotefit = "remotefit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
