# CODE MAP / COMMENTING GUIDE
# File purpose: GitHub Actions -julkaisutyönkulku dokumentaatiosivulle tai selainkäyttöliittymälle.
# Structure: general settings first; each following key or workflow step defines its own configuration group.
# Edit values carefully and preserve YAML indentation.

name: Deploy GitHub Pages demo

on:
  push:
    branches: [main, feature/weighted-skill-matching]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
