# CODE MAP / COMMENTING GUIDE
# File purpose: GitHub Actions test workflow: installs dependencies and runs automated tests.
# Structure: general settings first; each following key or workflow step defines its own configuration group.
# Edit values carefully and preserve YAML indentation.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools pytest
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dashboard dependencies
        working-directory: web
        run: npm install
      - name: Build TypeScript dashboard
        working-directory: web
        run: npm run build
      - name: Check browser demo JavaScript syntax
        run: node --check docs/demo.js
      - name: Run browser demo interaction tests
        run: node --test docs/demo.test.js
      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --audit-level=high
