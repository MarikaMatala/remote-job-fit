# CODE MAP / COMMENTING GUIDE
# File purpose: GitHub Actions -salaisuuksien tarkistus: etsii vahingossa julkaistuja tunnuksia ja avaimia.
# Structure: general settings first; each following key or workflow step defines its own configuration group.
# Edit values carefully and preserve YAML indentation.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
